name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted
    steps:
      - name: Build and deploy on VM
        run: |
          set -e
          cd /home/sysadmin/NextRH

          # Sync the deploy checkout to the merged main so we build the latest code.
          git fetch origin
          git reset --hard origin/main

          # Use whichever Compose is installed (v2 plugin or legacy v1 binary).
          if docker compose version >/dev/null 2>&1; then
            DC="docker compose"
          else
            DC="docker-compose"
          fi

          # Build and (re)start ONLY the app services. postgres / ollama / clamav /
          # n8n and the observability stack are left running untouched.
          $DC -f docker-compose.prod.yml build backend ai-service frontend
          $DC -f docker-compose.prod.yml rm -f backend ai-service frontend || true
          $DC -f docker-compose.prod.yml up -d --force-recreate backend ai-service frontend

          # Reclaim disk so repeated builds don't fill the VM.
          # NOTE: never use --volumes / volume prune here — that would delete the
          # Postgres DB and Ollama models. These only touch images/build cache.
          docker image prune -f
          docker builder prune -af --filter "until=168h"
