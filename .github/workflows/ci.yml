name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend-ci:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./frontend
    env:
      DB_NAME: testdb
      DB_PASSWORD: testpassword   
      DB_USER: testuser                
      DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/testdb  
      NODE_ENV: test   
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  backend-ci:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./backend
    env:
      DB_NAME: testdb
      DB_PASSWORD: testpassword   
      DB_USER: testuser                
      DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/testdb  
      NODE_ENV: test   
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  ai-service-ci:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./ai-service
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: testuser
      DB_PASSWORD: testpassword
      DB_NAME: testdb  
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr ffmpeg libsm6 libxext6

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test
        run: pytest
