name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend-ci:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./frontend
    env:
      DB_NAME: testdb
      DB_PASSWORD: testpassword   
      DB_USER: testuser                
      DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/testdb  
      NODE_ENV: test   
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npm run type-check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  backend-ci:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./backend
    env:
      DB_NAME: testdb
      DB_PASSWORD: testpassword   
      DB_USER: testuser                
      DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/testdb  
      NODE_ENV: test   
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  ai-service-ci:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./ai-service
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: testuser
      DB_PASSWORD: testpassword
      DB_NAME: testdb  
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          # Skip apt entirely when the tools are already on the VM (they persist
          # across runs on a self-hosted runner). Lock timeout + noninteractive
          # so it fails fast instead of hanging on apt locks / debconf prompts.
          if ! command -v tesseract >/dev/null 2>&1 || ! command -v ffmpeg >/dev/null 2>&1; then
            sudo -E apt-get -o DPkg::Lock::Timeout=120 update
            sudo -E apt-get -o DPkg::Lock::Timeout=120 install -y --no-install-recommends \
              tesseract-ocr ffmpeg libsm6 libxext6
          else
            echo "System deps already present, skipping apt."
          fi

      - name: Install Python dependencies
        run: |
          # Persistent venv lives in the runner's home (outside _work), so it
          # survives across runs. pip only does real work when requirements
          # change; otherwise every package is "already satisfied" (no downloads).
          python -m venv ~/ci-venv-ai-service
          source ~/ci-venv-ai-service/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Make the venv the active interpreter for subsequent steps.
          echo "PATH=$PATH" >> "$GITHUB_ENV"

      - name: Test
        run: pytest
