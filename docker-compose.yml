services:
  # PostgreSQL Database
  postgres:
    image: pgvector/pgvector:pg14
    container_name: cv-postgres
    environment:
      POSTGRES_DB: cv_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5435:5432"
    networks:
      - cv-network
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - cv-network
    depends_on:
      - postgres
  # NestJS Backend
  backend:
    build:
      context: ./backend
      target: development
    container_name: cv-backend
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: cv_management
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@postgres:5432/cv_management
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./file-storage:/app/file-storage
      - ./backend/src:/app/src    # Hot reload in dev
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    networks:
      - cv-network
    command: npm run start:dev

  # Python AI Service (Optional - add when needed)
  ai-service:
    build: ./ai-service
    container_name: cv-ai-service
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
    volumes:
      - ./file-storage:/app/file-storage
    ports:
      - "8000:8000"
    networks:
      - cv-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # React Frontend
  frontend:
    build: ./frontend
    container_name: cv-frontend
    environment:
      VITE_API_URL: http://localhost:3000
    volumes:
      - ./frontend/src:/app/src    # Hot reload
    ports:
      - "5173:5173"
    networks:
      - cv-network
    command: npm run dev

  # Ollama for local LLM hosting
  ollama:
    image: ollama/ollama:latest
    container_name: cv-ollama
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - cv-network

  # Qdrant vector database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: cv-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - cv-network

networks:
  cv-network:
    driver: bridge

volumes:
  postgres-data:
  ollama_data:
  qdrant_data:
