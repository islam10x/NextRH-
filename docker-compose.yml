version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: pgvector/pgvector:pg14
    container_name: cv-postgres
    environment:
      POSTGRES_DB: cv_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - cv-network
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - cv-network
    depends_on:
      - postgres
  # NestJS Backend
  backend:
    build:
      context: ./backend
      target: development
    container_name: cv-backend
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: cv_management
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@postgres:5432/cv_management
      JWT_SECRET: ${JWT_SECRET}
      CLAMAV_ENABLED: 'true'
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      CLAMAV_TIMEOUT: 60000
      N8N_WEBHOOK_URL: http://cv-n8n:5678/webhook/nextrh-notification
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-nextrh-n8n-secret}
    volumes:
      - ./file-storage:/app/file-storage
      - ./backend/src:/app/src    # Hot reload in dev
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    networks:
      - cv-network
    command: npm run start:dev

  # Python AI Service
  ai-service:
    build: ./ai-service
    container_name: cv-ai-service
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:${DB_PASSWORD}@postgres:5432/cv_management
      - OLLAMA_URL=http://ollama:11434
      - RAG_CHAT_MODEL=${RAG_CHAT_MODEL:-qwen2.5:1.5b-instruct}
      - RAG_CHAT_TIMEOUT_SECONDS=${RAG_CHAT_TIMEOUT_SECONDS:-30}
    volumes:
      - ./file-storage:/app/file-storage
      - ./ai-service/app:/app/app
    ports:
      - "8000:8000"
    networks:
      - cv-network
    depends_on:
      - postgres
      - ollama
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Ollama for LLM and Embeddings
  ollama:
    image: ollama/ollama:latest
    container_name: cv-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - cv-network
 

  # Helper to pull models automatically
  ollama-pull-models:
    image: curlimages/curl:latest
    container_name: cv-ollama-puller
    networks:
      - cv-network
    depends_on:
      - ollama
    entrypoint: /bin/sh
    command:
      - "-c"
      - |
        echo "Waiting for Ollama to start..."
        until curl -s http://ollama:11434/api/tags > /dev/null; do sleep 2; done
        echo "Pulling Qwen 2.5 1.5B instruct..."
        curl -X POST http://ollama:11434/api/pull -d '{"name": "qwen2.5:1.5b-instruct"}'
        echo "Pulling Nomic Embed Text..."
        curl -X POST http://ollama:11434/api/pull -d '{"name": "nomic-embed-text"}'
        echo "Models pulled successfully."

  # ClamAV daemon for antivirus scanning
  clamav:
    image: clamav/clamav:stable
    container_name: cv-clamav
    volumes:
      - clamav-db:/var/lib/clamav
    networks:
      - cv-network
    ports:
      - "3310:3310"
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G


  # React Frontend
  frontend:
    build: ./frontend
    container_name: cv-frontend
    environment:
      VITE_API_URL: http://localhost:3000
    volumes:
      - ./frontend/src:/app/src    # Hot reload
    ports:
      - "5173:5173"
    networks:
      - cv-network
    command: npm run dev

  # n8n Workflow Automation
  n8n:
    image: n8nio/n8n:latest
    container_name: cv-n8n
    restart: unless-stopped
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Europe/Paris
    volumes:
      - n8n-data:/home/node/.n8n
    ports:
      - "5678:5678"
    networks:
      - cv-network

networks:
  cv-network:
    driver: bridge

volumes:
  postgres-data:
  ollama-data:
  clamav-db:
  n8n-data:
